# ── Server ──────────────────────────────────────
server.port=${PORT:8080}

# ── PostgreSQL (Render injects DATABASE_URL) ─────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/phishguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── AI Service (Python on Render) ────────────────
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

# ── CORS ─────────────────────────────────────────
cors.allowed.origins=${CORS_ORIGINS:http://localhost:5173}

# ── Blockchain ───────────────────────────────────
blockchain.difficulty=${BLOCKCHAIN_DIFFICULTY:3}
blockchain.node-id=${BLOCKCHAIN_NODE_ID:node-1}

# ── Connection pool ───────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ── Authentication & Security ────────────────────
jwt.secret=${JWT_SECRET:phishguard-ultra-secure-jwt-secret-key-32chars-min-2026}
jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}

# ── Email & SMTP Configuration ───────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:hello.aurasync@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000

rresend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}